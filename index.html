<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUNDUS MIRIS</title>
<link rel="preload" as="image" href="assets/MundusMirisImage.png">
<link rel="preload" as="image" href="assets/MundusMirisTitleImage.png" fetchpriority="low">
<link rel="stylesheet" href="game.css">
<style>
  /* This page carries no canvas, so #wrap needs the stage height itself. */
  #wrap{height:620px; max-height:100vh; border:2px solid var(--line); overflow:hidden;}

  /* Menu screens — opaque, so there's no white flash while a ~2MB PNG decodes */
  .screen{background:var(--ink); overflow:hidden;
    flex-direction:column; justify-content:flex-end;}
  /* letterbox: the whole square is shown, dark bars fill the landscape frame */
  .screenArt{position:absolute; inset:0; width:100%; height:100%;
    object-fit:contain; object-position:center top;}
  .screenBody{position:relative; z-index:1; width:100%; padding:0 0 24px;
    background:linear-gradient(to top, rgba(6,6,12,.94) 34%, rgba(6,6,12,0));}
  .screenPrompt{font-size:20px; font-weight:bold; letter-spacing:4px; color:var(--gold);
    text-shadow:0 2px 6px #000, 0 0 14px rgba(0,0,0,.9);
    opacity:0; transition:opacity .4s ease;}
  .screenPrompt.ready{opacity:1; animation:promptPulse 1.6s ease-in-out infinite;}
  @keyframes promptPulse{50%{opacity:.4;}}

  .menuCard{background:rgba(18,18,28,.9); border:1px solid var(--line);
    display:inline-block; padding:16px 26px;}
  .menuCard h2{font-size:12px; letter-spacing:4px; color:var(--gold); margin-bottom:10px;}
  /* Real links, so mouse, keyboard, back button and middle-click all just work */
  .levelBtn{display:block; width:250px; margin:5px auto; background:transparent;
    color:var(--bone); border:1px solid var(--line); font-family:inherit;
    font-size:12px; letter-spacing:2px; padding:9px; cursor:pointer;
    text-decoration:none;}
  .levelBtn:hover, .levelBtn.sel{color:var(--gold); border-color:var(--gold);
    background:rgba(201,162,39,.10);}
  .levelBtn:focus{outline:none;}
  .levelBtn:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  .soon{font-size:10px; letter-spacing:2px; color:var(--dim); margin-top:12px;}
  .menuHelp{font-size:10px; letter-spacing:1px; color:var(--dim); margin-top:8px;}

  @media (prefers-reduced-motion: reduce){
    .screenPrompt.ready{animation:none;}
  }
</style>
</head>
<body>
<div id="wrap">

  <!-- Splash. Shown inline so it is opaque on the very first paint, before
       any JS runs. -->
  <div class="overlay screen" id="splashScreen" style="display:flex" aria-label="Mundus Miris">
    <img class="screenArt" src="assets/MundusMirisImage.png" alt="Mundus Miris">
    <div class="screenBody">
      <p class="screenPrompt" id="splashPrompt" aria-live="polite">LOADING…</p>
    </div>
  </div>

  <!-- Title + level select -->
  <div class="overlay screen" id="titleScreen" aria-label="Level select">
    <img class="screenArt" src="assets/MundusMirisTitleImage.png" alt="Mundus Miris">
    <div class="screenBody">
      <div class="menuCard">
        <h2>SELECT LEVEL</h2>
        <div id="levelList">
          <a class="levelBtn" href="level1.html">LEVEL 1 — LANDING</a>
        </div>
        <p class="soon">ADDITIONAL LEVELS COMING SOON</p>
        <p class="menuHelp">↑ ↓ SELECT · E / ENTER CONFIRM · OR CLICK</p>
      </div>
    </div>
  </div>

</div>

<script>
"use strict";
/* ============================================================
   MUNDUS MIRIS — front matter: splash -> title/level select.
   The levels themselves live on their own pages (level1.html), so this
   page loads no game engine at all — just the two pieces of key art.
   ============================================================ */

const splash = document.getElementById('splashScreen');
const title  = document.getElementById('titleScreen');
const levelBtns = Array.from(document.querySelectorAll('#levelList .levelBtn'));

let screenMode = 'splash';   // 'splash' | 'title'
let menuGuard = 0;           // debounce so one keypress can't cross two screens
let selIdx = 0;

function paintSelection(){
  levelBtns.forEach((b,i)=> b.classList.toggle('sel', i===selIdx));
}
function moveSelection(delta){
  if(levelBtns.length < 2) return;
  selIdx = (selIdx + delta + levelBtns.length) % levelBtns.length;
  paintSelection(); levelBtns[selIdx].focus();
}

function setScreen(next){
  screenMode = next;
  // .overlay pre-sets flex, so 'flex' is the show idiom here (not 'block')
  splash.style.display = next==='splash' ? 'flex' : 'none';
  title.style.display  = next==='title'  ? 'flex' : 'none';
  menuGuard = performance.now() + 180;
  if(next==='title'){
    paintSelection();
    requestAnimationFrame(()=> levelBtns[selIdx] && levelBtns[selIdx].focus());
  }
}

splash.addEventListener('click', ()=>{ if(screenMode==='splash') setScreen('title'); });
levelBtns.forEach((b,i)=>{
  b.addEventListener('mouseenter', ()=>{ selIdx=i; paintSelection(); });
  b.addEventListener('focus',      ()=>{ selIdx=i; paintSelection(); });
});

window.addEventListener('keydown', e => {
  if(e.repeat) return;                        // held E must not cross both screens
  if(performance.now() < menuGuard) return;   // fast double-tap debounce
  const k = e.key;
  if(screenMode==='splash'){
    if(k==='e'||k==='E'||k==='Enter'){ e.preventDefault(); setScreen('title'); }
    return;
  }
  if(k==='ArrowUp'||k==='w'||k==='W'){ e.preventDefault(); moveSelection(-1); }
  else if(k==='ArrowDown'||k==='s'||k==='S'){ e.preventDefault(); moveSelection(1); }
  else if(k==='e'||k==='E'){ e.preventDefault(); levelBtns[selIdx] && levelBtns[selIdx].click(); }
  else if(k==='Escape'){ e.preventDefault(); setScreen('splash'); }
  // Enter on a focused link is left to the browser's native activation
});

/* Hold the prompt back until the splash art is actually on screen, so the
   first thing a visitor sees isn't "PRESS E" over an empty frame. */
(function primeSplash(){
  let done=false;
  const prompt = document.getElementById('splashPrompt');
  const ready = ()=>{ if(done) return; done=true;
    prompt.textContent='PRESS E TO CONTINUE'; prompt.classList.add('ready'); };
  const img = new Image(); img.src='assets/MundusMirisImage.png';
  (img.decode ? img.decode() : Promise.reject()).then(ready).catch(()=>{
    if(img.complete) ready(); else { img.onload=ready; img.onerror=ready; }
  });
  setTimeout(ready,3000);   // failsafe: never stuck on LOADING…
})();

/* Coming back from a level (index.html#levels) should land on the level list,
   not replay the splash. */
setScreen(location.hash === '#levels' ? 'title' : 'splash');
</script>
</body>
</html>
